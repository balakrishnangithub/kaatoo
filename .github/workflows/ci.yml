# Kaatoo CI — every push and PR must pass all four gates.
# Fast, boring, and strict on purpose: this is what lets people merge with confidence.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# cancel superseded runs on the same branch — saves CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install (locked)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Build (type-check + bundle)
        run: npm run build
